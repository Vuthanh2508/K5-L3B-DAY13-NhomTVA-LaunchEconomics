#
# D1 · Cỡ mẫu (baseline 0,70; mục tiêu +5 điểm; alpha 0,05; power 0,8; ICC 0,02)
#   a) Chia theo yêu cầu:
#   b) Theo nhân viên, m = 75:
#   c) 20 nhân viên mỗi nhóm:
#   d) 6 depot mỗi nhóm:
#   e) Mức chênh 6 điểm (859 mỗi nhóm), 20 nhân viên mỗi nhóm:
#
# D2 · Năm câu kiểm tra "tách được tác động" với cách chia đã chọn (mỗi câu một dòng):
#   1. Đối chứng chạy cùng thời gian: Có, 20 nhân viên nhóm đối chứng làm song song cùng tuần và cùng 12 depot với 20 nhân viên nhóm trợ lý.
#   2. Chia ngẫu nhiên hay do người chọn: Bốc thăm ngẫu nhiên bằng code với seed ghi trước, phân tầng theo depot.
#   3. Ảnh hưởng gián tiếp và cách giảm: Có rủi ro nhân viên cùng depot trao đổi gợi ý; giảm bằng cấp quyền truy cập riêng theo staff_id và log agent_suggestion_shown / staff_review_decision theo từng staff_id.
#   4. Chỉ số chính, ngưỡng, ngày quyết định đã viết trước: Có, chỉ số chính, MDE 0,06, 3 luật dừng và ngày quyết định chốt trước ngày chạy pilot.
#   5. Ít nhất 20 cụm mỗi nhóm: Có, đúng 20 nhân viên mỗi nhóm (20 can thiệp + 20 đối chứng).
#
# Đánh đổi đã chấp nhận (nếu cách chia chưa đạt cả hai điều kiện):
#   20 nhân viên/nhóm có trần mẫu hiệu dụng c/ICC = 20/0,02 = 1.000 < 1.251 nên không đủ thấy +5 điểm; chấp nhận MDE = 6 điểm (n = 859/nhóm, m >= 299 yc/người, DE = 6,96), power còn ~0,64 nếu tác động thật chỉ 5 điểm.
#
# Tỉ lệ mo_lai_trong_7_ngay hiện tại và ngưỡng an toàn đã chọn:
#   Toàn mẫu 4,25% (51/1.200), phạm vi noi_dia + hang_nang là 3,97% (39/982); không đặt trần 3% (sẽ dừng ngay tuần đầu) mà chọn cao hơn đối chứng >= 2 điểm hoặc vượt trần 6%.

