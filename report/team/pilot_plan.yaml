# Lab 13 · Nhiệm vụ D · Kế hoạch pilot trợ lý hoàn phí LogiX-VN (Gate 2a)
# Điền mọi chỗ có dấu hỏi. Khi nộp, ngoài các dòng chú thích không còn dấu hỏi nào.
# Kiểm tra đọc được: python -c "import yaml; yaml.safe_load(open('../report/team/pilot_plan.yaml'))"
#
# D1 · Cỡ mẫu (baseline 0,70; mục tiêu +5 điểm; alpha 0,05; power 0,8; ICC 0,02)
#   a) Chia theo yêu cầu: 1.251 yêu cầu mỗi nhóm
#   b) Theo nhân viên, m = 75: DE = 2,48; 3.103 mỗi nhóm -> cần 42 nhân viên/nhóm (tổng 84 > 40: không đủ người)
#   c) 20 nhân viên mỗi nhóm: trần c/ICC = 20/0,02 = 1.000 mẫu hiệu dụng (< 1.251: không đạt +5 điểm)
#   d) 6 depot mỗi nhóm: trần 6/0,02 = 300 mẫu hiệu dụng (< 20 cụm/nhóm: loại)
#   e) Mức chênh 6 điểm (859 mỗi nhóm), 20 nhân viên mỗi nhóm: cần m >= 299 yêu cầu/nhân viên (DE = 6,96); power còn ~0,64 ở mức +5 điểm
#
# D2 · Năm câu kiểm tra "tách được tác động" với cách chia đã chọn (mỗi câu một dòng):
#   1. Đối chứng chạy cùng thời gian: Có, 20 nhân viên nhóm đối chứng làm song song cùng tuần và cùng 12 depot với 20 nhân viên nhóm trợ lý.
#   2. Chia ngẫu nhiên hay do người chọn: Bốc thăm ngẫu nhiên bằng code với seed ghi trước, phân tầng theo depot.
#   3. Ảnh hưởng gián tiếp và cách giảm: Có rủi ro nhân viên cùng depot trao đổi gợi ý; giảm bằng cấp quyền truy cập riêng theo staff_id và log agent_suggestion_shown / staff_review_decision theo từng staff_id.
#   4. Chỉ số chính, ngưỡng, ngày quyết định đã viết trước: Có, chỉ số chính, MDE 0,06, 3 luật dừng và ngày quyết định chốt trước ngày chạy pilot.
#   5. Ít nhất 20 cụm mỗi nhóm: Có, đúng 20 nhân viên mỗi nhóm (20 can thiệp + 20 đối chứng).
#
# Đánh đổi đã chấp nhận (nếu cách chia chưa đạt cả hai điều kiện):
#   20 nhân viên/nhóm có trần mẫu hiệu dụng c/ICC = 20/0,02 = 1.000 < 1.251 nên không đủ thấy +5 điểm; chấp nhận MDE = 6 điểm (n = 859/nhóm, m >= 299 yc/người, DE = 6,96), power còn ~0,64 nếu tác động thật chỉ 5 điểm.
#
# Tỉ lệ mo_lai_trong_7_ngay hiện tại và ngưỡng an toàn đã chọn:
#   Toàn mẫu 4,25% (51/1.200), phạm vi noi_dia + hang_nang là 3,97% (39/982); không đặt trần 3% (sẽ dừng ngay tuần đầu) mà chọn cao hơn đối chứng >= 2 điểm hoặc vượt trần 6%.

pilot:
  owner: "Giám đốc vận hành LogiX-VN"
  scope: "Chỉ noi_dia (0,22x) và hang_nang (0,69x) tại 12 depot [simulated]; loại quoc_te (1,88x) và doi_tac (0,85x)"
  assignment:
    unit: "staff"
    control_share: 0.5
    randomized: true
  rollout: [0.10, 0.25, 0.50]     # 4 -> 10 -> 20 nhân viên/nhóm; bước 0.50 chạy tối thiểu 8-10 ngày để đủ m >= 299 đơn/người (không dừng ở 7 ngày) + 7 ngày theo dõi mở lại
  primary_metric:
    name: dong_trong_24h_khong_mo_lai_7_ngay
    baseline: 0.70
    mde: 0.06                     # chấp nhận MDE 6 điểm; power còn ~0,64 nếu tác động thật chỉ 5 điểm
    alpha: 0.05
    power: 0.80
    n_per_arm: 859
    design_effect: 6.96
    clusters_per_arm: 20
  identifiability:
    concurrent_control: "Có: 20 nhân viên đối chứng làm cùng tuần, cùng 12 depot (bốc thăm ngẫu nhiên phân tầng theo depot với seed cố định)"
    spillover_risk: "Rủi ro chia sẻ câu trả lời trong cùng depot; giảm bằng cấp quyền truy cập trợ lý theo tài khoản staff_id và ghi log agent_suggestion_shown / staff_review_decision theo staff_id"
    predeclared: "Có: chốt trước ngày bắt đầu gồm chỉ số chính dong_trong_24h_khong_mo_lai_7_ngay, MDE 0,06, 3 luật dừng và ngày quyết định"
  stop_rules:
    - "NẾU ở mọi bước có >= 1 ca hoàn trùng (refund_ledger_write) hoặc nhắn đã hoàn nhưng sổ cái không ok (refund_notice_sent vs refund_ledger_write) hoặc mở lại 7 ngày > 6% (nền pilot 3,97%), HOẶC từ bước 0.25 (10 nhân viên) trở lên mở lại 7 ngày của nhóm trợ lý cao hơn đối chứng >= 2 điểm phần trăm TRONG 3 ngày liên tiếp THÌ Giám đốc vận hành LogiX-VN bấm cờ tắt trợ lý trong 30 phút KHÔNG THÌ không được chuyển sang bước rollout tiếp theo"
    - "NẾU chi phí biến đổi mỗi việc thành công (chỉ tính token, tool, xem lại, làm lại; chưa gồm 40 triệu đ/tháng cố định) > 8.000 đ hoặc tỉ lệ xem lại > 50% từ bước rollout 0.25 (kèm tỉ lệ lam_lai > 7%) TRONG 2 tuần liên tiếp THÌ PM trợ lý hoàn phí thu hẹp phạm vi về chỉ noi_dia và giới hạn tối đa 2 lần chạy KHÔNG THÌ không được mở rộng tiếp hang_nang"
    - "NẾU tỉ lệ bỏ qua gợi ý (sua + bo) > 40% hoặc tỉ lệ yêu cầu có gợi ý được hiển thị (agent_suggestion_shown) < 60% ở nhóm can thiệp TRONG 1 tuần THÌ Trưởng nhóm CSKH phỏng vấn 5 nhân viên trong 3 ngày để sửa quy trình/giao diện KHÔNG THÌ không được chuyển bước rollout tiếp theo"
  interim_looks: "chỉ kiểm tra chỉ số an toàn; chỉ đọc chỉ số chính khi bước 0.50 đạt m >= 299 đơn/người"
  rollback: "Giám đốc vận hành LogiX-VN bấm cờ tắt trợ lý, hiệu lực trong 30 phút; khách được phục vụ bằng luồng nhân viên CSKH tự làm"
  decision_date: "2027-01-15"     # sau bước 0.10 (1 tuần) + 0.25 (1 tuần) + 0.50 (>= 10 ngày đủ m >= 299) + 7 ngày theo dõi mo_lai_trong_7_ngay
  simulated_inputs:
    - "CPS toàn mẫu 4.472 đ (simulated)"
    - "CPS noi_dia 2.696 đ (0,22x) và hang_nang 8.221 đ (0,69x) (simulated)"
    - "CPS phạm vi pilot 3.414 đ chưa cố định và 4.599 đ có cố định 40tr/tháng (simulated)"
    - "Xem lại 100%: 11.743 đ (0,98x) ở 9 phút/ca hoặc 12.415 đ (1,03x) ở 15,3 phút/ca (simulated)"
    - "Hai cột gốc phut_xem_lai_simulated và phut_lam_lai_simulated trong logix_requests.csv"
